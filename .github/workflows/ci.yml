name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # No recursive submodules: the Makefile initialises what it needs.
      - uses: actions/checkout@v7
      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/check-tag.sh "$GITHUB_REF_NAME"
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Test
        run: nix develop -c make test
      - name: Build
        run: nix develop -c make dist
      - uses: actions/upload-artifact@v7
        with:
          name: nx-discord-rpc-out
          path: out/
          include-hidden-files: true
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Fetch tag annotation
        run: git fetch --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - name: Check tag matches VERSION
        run: scripts/check-tag.sh "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v8
        with:
          name: nx-discord-rpc-out
          path: out
      # zip and sha256sum are preinstalled on ubuntu-latest, so no Nix needed here.
      - name: Package
        run: scripts/package-release.sh
      - name: Release notes
        run: |
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME" > release/NOTES.md
          if [ -z "$(tr -d '[:space:]' < release/NOTES.md)" ]; then
            echo "See README for installation instructions." > release/NOTES.md
          fi
          printf '\n%s\n' "Source code: this tag (clone with \`git clone --recursive\`)." >> release/NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          # The single files are what the in-app updater downloads; their names must not change.
          files: |
            release/*.zip
            release/exefs.nsp
            release/toolbox.json
            release/nx-discord-rpc.nro
            release/nx-discord-rpc.ovl
            release/SHA256SUMS
          fail_on_unmatched_files: true
          body_path: release/NOTES.md
